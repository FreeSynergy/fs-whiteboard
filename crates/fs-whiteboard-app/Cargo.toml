[package]
name = "fs-whiteboard-app"
description = "The whiteboard program of FreeSynergy, window: the generated admin frontend over boards, pages and elements (ADR 0065, 0066)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fs-whiteboard-core = { path = "../fs-whiteboard-core" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.2" }
# provisional: a commit of the branch thread-a-admin-frontend; becomes a tag once reviewed (Strategy switches it)
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688ceef35d0f1a1c131d392a9da9f88e4bb9379" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688ceef35d0f1a1c131d392a9da9f88e4bb9379" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688ceef35d0f1a1c131d392a9da9f88e4bb9379" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688ceef35d0f1a1c131d392a9da9f88e4bb9379" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
