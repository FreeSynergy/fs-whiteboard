[package]
name = "fs-whiteboard-core"
description = "Program core of FreeSynergy whiteboard: boards as queryable objects, merged per property"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
rstar = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
