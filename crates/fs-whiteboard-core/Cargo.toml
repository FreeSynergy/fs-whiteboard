[package]
name = "fs-whiteboard-core"
description = "Program core of FreeSynergy whiteboard: boards as queryable objects, merged per property"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.3.0" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.26.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
rstar = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
